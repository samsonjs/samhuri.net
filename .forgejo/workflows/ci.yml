# CI on mudge's Forgejo runner.
#
# The checkout is sjs/actions/checkout, referenced by full URL so the runner
# fetches it from git.samhuri.net rather than data.forgejo.org, which is a
# network dependency that has already broken once. It's plain git rather than
# a JavaScript action, so the job can run in the official Ruby image (no Node
# required) pinned to the version in .ruby-version. The Gemfile reads the same
# file, so an image that disagrees with the pin fails loudly at bundle install.
#
# bin/bootstrap isn't used here: it reaches for sudo apt on Linux, and the Ruby
# image already carries everything the bundle needs. bundle install is all
# that's left of it that matters in CI.
#
# Gems live on a bind mount off the runner's cache directory so puma and
# friends aren't compiled from source every run. mudge allows this one
# subtree; see container.valid_volumes in its runner config.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "static/**"
      - "wayback/**"
      - "images/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "static/**"
      - "wayback/**"
      - "images/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Coverage, lint, debug build
    # The runner maps this label to a plain image; the container below is what
    # actually runs.
    runs-on: docker
    container:
      image: docker.io/library/ruby:4.0.5
      volumes:
        - /home/forgejo-runner/cache/samhuri.net-gems:/gems
    timeout-minutes: 20
    env:
      BUNDLE_PATH: /gems
    steps:
      - name: Check out
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
        with:
          require-file: Gemfile

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - name: Coverage
        run: bundle exec bake coverage

      - name: Lint
        run: bundle exec bake lint

      - name: Debug build
        run: bundle exec bake debug
