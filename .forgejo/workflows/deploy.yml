# Deploy from mudge's Forgejo runner. Every push to main publishes beta; a
# production publish is dispatched by hand from the Actions tab (or `tea` /
# the API) with target=production. A dispatch may also name beta, which is
# how a beta deploy is rerun without pushing anything. A push made by
# bin/publish-draft or bin/post-link publishes production itself while
# holding the lock below, so the beta deploy it triggers simply waits its
# turn. The site is served from mudge and mudge is the runner host, so the job
# runs in host mode and rsyncs straight into the publish directories rather
# than over SSH. SAMHURI_PUBLISH_HOST=local pins that even though bake.rb would
# work it out from the hostname.
#
# The job runs as the forgejo-runner user, not sjs, so nothing under
# /home/sjs is reachable from here. The runner's shell has no Ruby on PATH, so
# the newest rv Ruby in the series .ruby-version names is exported explicitly.
# Gems go to the runner's own cache directory: the bind mount CI uses is a
# container feature and this job has no container, and the gems compiled
# inside the ruby image aren't guaranteed to load on the host anyway.
#
# The checkout is a fresh fetch of the dispatched ref into the job workspace,
# not the long-lived clone at ~sjs/samhuri.net that bin/publish-draft and the
# web app write to. The two share the publish lock beside the production site
# (created by the mudge repo's caddy plugin, which also grants this account
# the ACL it needs on the publish directories) so a deploy and a draft publish
# can't rsync over each other; bin/publish-draft gives up straight away when
# it's held, so this side waits instead.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        required: true
        default: beta
        options:
          - beta
          - production

concurrency:
  group: deploy

jobs:
  deploy:
    name: Publish ${{ inputs.target || 'beta' }}
    runs-on: mudge
    timeout-minutes: 15
    env:
      BUNDLE_PATH: /home/forgejo-runner/cache/samhuri.net-deploy-gems
      SAMHURI_PUBLISH_HOST: local
      # inputs.target is empty on a push, and a push only ever publishes beta.
      DEPLOY_TARGET: ${{ inputs.target || 'beta' }}
    steps:
      - name: Check out
        uses: https://git.samhuri.net/sjs/actions/checkout@v1
        with:
          require-file: Gemfile

      - name: Install gems
        run: |
          export PATH="$(dirname "$("$HOME/.cargo/bin/rv" ruby find "$(cat .ruby-version)")"):$PATH"
          bundle check >/dev/null 2>&1 || bundle install --quiet --jobs 4 --retry 3

      - name: Publish
        run: |
          export PATH="$(dirname "$("$HOME/.cargo/bin/rv" ruby find "$(cat .ruby-version)")"):$PATH"
          case "$DEPLOY_TARGET" in
            beta) task=publish_beta ;;
            # publish covers HTML, the Gemini capsule, and static.samhuri.net.
            production) task=publish ;;
            *) echo "unknown target: $DEPLOY_TARGET"; exit 1 ;;
          esac
          # A stale www/ or gemini/ from an earlier run in this workspace would
          # be rsynced --delete onto the live site, so start from nothing.
          bundle exec bake clean
          flock -w 600 /var/www/samhuri.net/.publish.lock bundle exec bake "$task"

      # Beta also goes to Cloudflare Pages (samhuri-beta.pages.dev), to prove the
      # path before any hostname moves. The runner has no Node, so wrangler runs
      # in a node container with the built www/ mounted read-only.
      - name: Upload beta to Cloudflare Pages
        if: env.DEPLOY_TARGET == 'beta'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler() {
            podman run --rm --log-driver=none \
              -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID \
              -v "$PWD/www:/site:ro" -w /tmp docker.io/library/node:26-slim \
              npx --yes wrangler@4.145.0 "$@"
          }
          wrangler pages project create samhuri-beta --production-branch main || true
          wrangler pages deploy /site --project-name samhuri-beta --branch main

      # www.samhuri.net is a Pages project holding nothing but a catch-all
      # redirect to the apex (www-redirect/_redirects). Redeploying it is a no-op
      # until that file changes.
      - name: Upload www redirect to Cloudflare Pages
        if: env.DEPLOY_TARGET == 'beta'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler() {
            podman run --rm --log-driver=none \
              -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID \
              -v "$PWD/www-redirect:/site:ro" -w /tmp docker.io/library/node:26-slim \
              npx --yes wrangler@4.145.0 "$@"
          }
          wrangler pages project create samhuri-www --production-branch main || true
          wrangler pages deploy /site --project-name samhuri-www --branch main

      # sami.samhuri.net is a legacy host: sami-redirect/_worker.js maps its old
      # date-based post URLs to /posts/YYYY/MM/slug and sends the rest to the apex.
      - name: Upload sami redirect to Cloudflare Pages
        if: env.DEPLOY_TARGET == 'beta'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler() {
            podman run --rm --log-driver=none \
              -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID \
              -v "$PWD/sami-redirect:/site:ro" -w /tmp docker.io/library/node:26-slim \
              npx --yes wrangler@4.145.0 "$@"
          }
          wrangler pages project create samhuri-sami --production-branch main || true
          wrangler pages deploy /site --project-name samhuri-sami --branch main
